<!--This is the "Face" of your extension—what you see when you click the icon-->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; }
        .btn-group { display: flex; gap: 5px; }
        button { cursor: pointer; padding: 8px; flex: 1; }
        #loader { display: none; color: blue; margin: 10px 0; }
        #output { margin-top: 10px; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h3>AI Summarizer</h3>
    <div id="page-title" style="font-weight: bold; margin-bottom: 10px; font-size: 12px; color: #555;"></div>
    <div class="btn-group">
        <button id="summarize-btn">Summarize</button>
        <button id="reset-btn">Clear</button>
    </div>
    <div id="loader">Processing...</div>
    <div id="output"></div>
    <script src="popup.js"></script>
</body>
</html>
